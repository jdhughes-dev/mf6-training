[workspace]
name = "mf6-training"
version = "0.1.0"
channels = ["conda-forge"]
# Minimum pixi: the per-platform `platforms` tables below need 0.71.0, and
# pixi.lock is v7 (0.68.0). Without this floor an older pixi stops on a bare
# TOML parse error ("expected a string, found table").
requires-pixi = ">=0.71"
# Per-platform virtual-package requirements (replaces the deprecated
# [system-requirements] table):
#  - linux-64 pins a lower __linux (kernel) version for the openmpi/petsc stack
#    used by the parallel (extended) MODFLOW 6 build.
#  - the macOS minimums keep resolution on recent SDKs so conda-forge can supply
#    the openmpi/petsc binaries the extended MODFLOW 6 build links against.
platforms = [
    "win-64",
    { platform = "linux-64", linux = "4.4.0" },
    { platform = "linux-aarch64", linux = "4.4.0" },
    { platform = "osx-arm64", macos = "14.0" },
    "osx-64",
]

[dependencies]
python = "3.11.*"
# pandas stays below 3: pyemu (pulled in by mf6adj) caps it at <3 through 1.7.0,
# its newest release, so a pandas 3 environment silently drops pyemu back to
# 1.4.0. Lift the ceiling once pyemu supports pandas 3.
pandas = ">=2.0,<3.0"
numpy = "*"
matplotlib = "*"
jupyter = "*"
jupyterlab = "*"
notebook = "*"
scipy = "*"
shapely = "*"
rtree = "*"
pyproj = ">=2.0"
pyshp = "*"
git = "*"
nbconvert = "*"
# Core MODFLOW 6 stack (flopy to build/post-process models; modflowapi to drive
# a running MODFLOW 6 through the libmf6 shared library).
#   * flopy comes from its develop branch in [pypi-dependencies] below - not the
#     conda flopy - because Mf6Splitter cannot split GWT advanced-transport
#     packages (SFT/LKT/UZT/MWT) in the 3.10.0 release: it reads a non-existent
#     .perioddata and mis-keys the SFR remap table. develop fixes both (used by
#     parallel.ipynb).
#   * modflowapi comes from conda-forge. The develop branch was needed only
#     because the 0.2.0 release called np.arange() on a 1-element array, which
#     NumPy 2.x rejects; the 1.0.0 release carries that fix.
modflowapi = ">=1.0.0"
# Dev tooling for the pre-commit hook: ruff (lint + format), nbstripout
# (clear notebook outputs), and codespell (spell-check + fix), driven by
# pre-commit itself. See .pre-commit-config.yaml and the pre-commit-install
# task below.
ruff = "*"
nbstripout = "*"
codespell = "*"
pre-commit = "*"
xarray = ">=2026.4.0,<2027"
netcdf4 = ">=1.7.2,<2"
pyarrow = ">=21.0.0,<25"
ipython = ">=9.15.0,<10"
ipywidgets = ">=8.1.8,<9"
geopandas = ">=1.1.4,<2"
pyvista = ">=0.44.1,<0.49"
rasterio = ">=1.4.3,<2"
rasterstats = ">=0.21.0,<0.22"
# Mf6Splitter extras (model-splitting-with-flopy.ipynb): pymetis powers
# optimize_splitting_mask()'s load-balanced partitioning; h5py backs
# save_node_mapping()/load_node_mapping().
pymetis = "*"
h5py = "*"

[pypi-dependencies]
# flopy tracks its develop branch (not the conda-forge release) for the fix
# noted in [dependencies] above. Tracking the branch rather than a pinned commit
# keeps it current with the latest upstream changes; the trade-off is that the
# resolved version is variable, so a re-solve (pixi install / update) can pull
# newer commits.
flopy = { git = "https://github.com/modflowpy/flopy.git", branch = "develop" }
# Provides the DFN->TOML toolchain that flopy's `generate_classes` needs. The
# get-mf6 task runs generate_classes so flopy's MODFLOW 6 input classes stay in
# sync with the modflow6 commit the installed mf6 reports (scripts/get_mf6.py).
# The `dfn` extra pulls boltons, pooch, pydantic, tomli, and tomli-w.
modflow-devtools = { version = "*", extras = ["dfn"] }
# Adjoint-state sensitivity analysis for MODFLOW 6 (Hayek and others, 2025),
# used by the mf6-adj-* notebooks. Tracks the repository rather than the 1.2.0
# release because the notebooks need the lak6 performance measure, the lake
# water balance solved with the flow equations (so a lake sensitivity accounts
# for the stage responding rather than holding it fixed), specific storage and
# specific yield reported separately, and the check that rejects packages adding
# equations to the solution matrix; switch to the released version once those
# ship. Installed from git rather than conda-forge so it resolves against the
# flopy develop build above instead of pulling the conda-forge flopy alongside
# it.
# main is the development branch; mf6adj has no separate develop branch. The
# spec tracks that branch, but pixi.lock still pins one commit from it, so a new
# upstream commit is only picked up by `pixi run update-mf6adj`.
mf6adj = { git = "https://github.com/INTERA-Inc/mf6adj.git", branch = "main" }

[tasks]
# Complete the setup once `pixi install` has created the environment: MODFLOW 6,
# the MODFLOW-family executables, and the git pre-commit hook. The steps run in
# order and stop at the first failure; each is idempotent, so re-running is safe.
install = { depends-on = ["get-mf6", "get-exes", "pre-commit-install"] }
# Launch JupyterLab in the project directory.
jupyter = "jupyter lab"
# Open the project in VS Code (requires the `code` CLI on PATH).
code = "code ."
# Build/download the parallel (extended) MODFLOW 6 for the current platform and
# resync flopy's MODFLOW 6 input classes with it. Idempotent: an mf6 already in
# the environment is left alone, and the classes are regenerated only when they
# no longer match the modflow6 commit it reports. Pass --force to rebuild and
# resync anyway. The activation hook runs this on every activation, so a flopy
# reinstall - which puts back the classes flopy ships - is picked up there too.
get-mf6 = "python scripts/get_mf6.py"
# Install the MODFLOW-family executables the notebooks need but that aren't
# provided by mf6: mp7 (MODPATH 7) for particle tracking, plus gridgen/triangle
# for unstructured grid generation. (mf6 itself comes from the get-mf6 task.)
# Prebuilt binaries come from flopy's get-modflow on the platforms USGS ships
# them for (win-64, linux-64, osx-arm64). On platforms with no prebuilt binaries
# - Intel macs (osx-64) and linux-aarch64 - they are built from source from the
# MODFLOW-ORG repos (get_exes.py delegates to build_exes.py) and installed into
# the env prefix like mf6. Pass --force to rebuild the source-built exes.
get-exes = "python scripts/get_exes.py"
# Verify mp7, triangle, and gridgen are installed on PATH (run after get-exes).
check-exes = "python scripts/check_exes.py"
# Re-lock mf6adj at the tip of its development branch and install it. The
# dependency tracks that branch, but the lock file pins one commit from it so
# everyone builds the same environment; this is how that pin is moved. It
# rewrites pixi.lock, so commit the result. The mf6-adj-* notebooks are the ones
# affected, and none of them are in the CI notebook set, so run them by hand
# afterwards:
#   pixi run test-notebooks examples/notebooks/mf6-adj-theis.ipynb
update-mf6adj = "pixi update mf6adj"
# Generate the hands-on student copies of the notebooks: the same prose and
# figures with the code marked "# exercise:" removed for students to write.
# With no arguments it converts every marked notebook in examples/notebooks;
# pass notebook paths to convert specific ones. Output goes to
# examples/notebooks-students/, which is committed so students can clone and
# start without running anything. That sits beside examples/notebooks/ rather
# than inside it so the ../data/... paths in the notebooks still resolve. A
# pre-commit hook runs this same script so the committed copies cannot drift.
student-notebooks = "python scripts/make_student_notebooks.py"
# Execute notebook(s) end-to-end as a smoke test (fails on any cell error).
# With no arguments it runs the notebooks listed in scripts/run_notebooks.py;
# pass notebook paths to run specific ones. Requires mf6 on PATH (get-mf6).
test-notebooks = "python scripts/run_notebooks.py"
# Install the git pre-commit hook. This runs automatically on first activation
# (see scripts/postinstall.*); this task is the manual/explicit way to (re)install
# it. The hook clears notebook outputs (nbstripout), fixes spelling (codespell),
# and applies ruff lint fixes + formatting on commit.
pre-commit-install = "pre-commit install"
# Run all pre-commit hooks against every file (not just staged changes).
pre-commit-run = "pre-commit run --all-files"

# --- Auto-install parallel (extended) MODFLOW 6 ---------------------------
# conda-forge does NOT ship a parallel-enabled mf6, so we provide it ourselves:
#   * Windows (win-64): download the prebuilt extended nightly and copy it in.
#   * Unix (linux-64, osx-64, osx-arm64): build from source with PETSc/MPI.
# pixi has no post-install hook, so we run the (idempotent) installer from an
# activation script. The first `pixi run`/`pixi shell` performs the build;
# every later activation is a fast no-op once `mf6` is present. Binaries are
# installed into the env prefix so they land on PATH automatically.
[target.unix.activation]
scripts = ["scripts/postinstall.sh"]

[target.win-64.activation]
scripts = ["scripts/postinstall.bat"]

# Build toolchain + extended-build libraries. Unix-only; Windows uses a
# prebuilt binary so it needs no compilers. One GNU toolchain everywhere
# (gcc/g++/gfortran) so mf6 and the from-source executables build the same way,
# matching how MODFLOW-ORG builds its release binaries.
# NOTE: conda-forge only started shipping *real* GNU gcc/g++ on macOS in Nov
# 2025 (before that its mac `gcc` was a clang wrapper). It is currently gcc 15
# only on osx, so the gcc version may differ across platforms - that's fine, it's
# the same compiler family throughout ("exclusive for version differences").
[target.unix.dependencies]
# build toolchain (meson >= 1.3.1 is required by the modpath-v7/triangle/gridgen
# repos built from source; also fine for the mf6 build)
gcc = "*"
gxx = "*"
gfortran = "*"
meson = ">=1.3.1"
ninja = "*"
pkg-config = "*"
# extended-build libraries (parallel + netcdf)
libnetcdf = "*"
netcdf-fortran = "*"
openmpi = "*"
petsc = "==3.20.5"
