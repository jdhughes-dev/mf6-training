name: Update pixi lockfile

on:
  schedule:
    # weekly, Monday 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

# The branch and the pull request are created with the App token below, so the
# GITHUB_TOKEN only has to check the repository out.
permissions:
  contents: read

jobs:
  update-lockfile:
    name: pixi update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false

      - name: Update lockfile
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      # Mint a short-lived installation token for the GitHub App that owns the
      # lockfile PR. The default GITHUB_TOKEN cannot be used: a PR it opens does
      # not trigger the CI workflow, so the updated lockfile would go unverified.
      # An App token has no expiry to renew (unlike a PAT) and is scoped to this
      # repository. The App needs contents + pull-requests write, and its ID and
      # private key are stored as repo secrets.
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PIXI_UPDATE_APP_ID }}
          private-key: ${{ secrets.PIXI_UPDATE_APP_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "ci: update pixi lockfile"
          title: "Update pixi lockfile"
          body-path: diff.md
          branch: update-pixi-lockfile
          base: main
          labels: dependencies
          delete-branch: true
          add-paths: pixi.lock
